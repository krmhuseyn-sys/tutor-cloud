# Tətbiqi oyaq saxlayır: hər 6 saatdan bir saytı açır, yatıbsa oyandırır.
# Əl ilə işlətmək: GitHub -> tutor-cloud -> Actions -> "Tətbiqi oyaq saxla" -> Run workflow.
# Tətbiq açılmasa iş "failed" olur və GitHub sənə e-poçt göndərir (sayt düşüb siqnalı).
name: Tətbiqi oyaq saxla

on:
  schedule:
    - cron: "17 */6 * * *"   # UTC 00:17, 06:17, 12:17, 18:17 (Bakı: 04:17, 10:17, 16:17, 22:17)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-24.04   # ubuntu-latest artıq 26.04-dür, Playwright onu hələ dəstəkləmir
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Brauzeri qur
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Saytı aç
        env:
          APP_URL: https://mytutor1.streamlit.app
        run: python .github/keepalive.py
      # Supabase pulsuz layihəni 7 gün sorğu olmayanda dayandırır. Bu addım bazaya kiçik bir oxuma sorğusu göndərir.
      # Yalnız publishable (anon) açar istifadə olunur; RLS səbəbindən heç bir data qaytarılmır, sadəcə baza "aktiv" sayılır.
      # Lazım olan GitHub Secrets: SUPABASE_URL və SUPABASE_KEY (publishable). service_role QOYMA.
      - name: Bazanı oyat
        if: always()
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::warning::SUPABASE_URL və ya SUPABASE_KEY secret-i yoxdur, baza oyadılmadı."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "${SB_URL%/}/rest/v1/profiles?select=id&limit=1")
          echo "Supabase cavabı: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Baza cavab vermədi (kod $code). Supabase panelində layihə dayandırılıbsa, Restore bas."
            exit 1
          fi